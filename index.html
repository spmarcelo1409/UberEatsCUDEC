<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>VentaPatito - Platillos</title>

  <!-- materialize icons, css & js -->
  <link type="text/css" href="/css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="/css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="/js/materialize.min.js"></script>

  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#FF8816">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="VPTT">
  <meta name="apple-mobile-web-app-title" content="VPTT">

  <link rel="icon" type="image/png" sizes="32x32" href="/iconos/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/iconos/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/iconos/icon-180x180.png">
</head>
<body class="grey lighten-4">

  <!-- Menu superior -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="/">Venta<span>Patito</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- Menu lateral -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">VentaPatito</a></li>
    <li><a href="/" class="waves-effect">Inicio</a></li>
    <li><a href="/pages/about.html" class="waves-effect">Acerca</a></li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/contact.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contacto</a>
    </li>
    <li><div class="divider"></div></li>
    <li><a href="/pages/pedidos.html" class="waves-effect">Pedidos</a></li>
  </ul>

  <!-- Lista de platillos -->
  <div class="recipes container grey-text text-darken-1"></div>

  <div class="center">
    <a class="btn-floating btn-large add-btn sidenav-trigger" data-target="side-form">
      <i class="material-icons">add</i>
    </a>
  </div>

  <!-- Agregar platillo -->
  <div id="side-form" class="sidenav side-form">
    <form class="add-recipe container section">
      <h6>Nuevo platillo</h6>
      <div class="divider"></div>
      <div class="input-field">
        <input placeholder="ejemplo: Pizza" id="title" name="title" type="text" class="validate" required>
        <label for="title">Nombre</label>
      </div>
      <div class="input-field">
        <input placeholder="ejemplo: Tofu, champinon, ajo" id="ingredientes" name="ingredientes" type="text" class="validate" required>
        <label for="ingredientes">Ingredientes</label>
      </div>
      <div class="input-field">
        <input placeholder="ejemplo: 50.00" id="price" name="price" type="number" step="0.01" min="0" class="validate" required>
        <label for="price">Precio</label>
      </div>
      <input id="fotoFinal" type="hidden" name="fotoFinal" value="">
      <div class="input-field center">
        <button class="btn-small" type="submit">Agregar</button>
      </div>
    </form>

    <div class="input-field center">
      <button id="btnFoto" type="button" class="btn-small">Imagen</button>
      <button id="btnCapturar" type="button" class="btn-small">Capturar</button>
    </div>

    <div class="container">
      <div id="camara">
        <video id="video" playsinline muted>No hay video disponible</video>
      </div>
      <canvas id="canvas"></canvas>
      <div id="salida">
        <img id="foto" alt="Foto del platillo">
      </div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="/js/ui.js"></script>
  <script src="/js/firebase.js"></script>
  <script src="/js/index.js"></script>
  <script src="/js/db.js"></script>
</body>
</html>
