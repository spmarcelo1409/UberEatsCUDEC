  <div class="center">
    <a class="btn-floating btn-small btn-large add-btn sidenav-trigger" data-target="side-form">
      <i class="material-icons">add</i>
    </a>
  </div>

  <!-- Agregar platillo -->
  <div id="side-form" class="sidenav side-form">
    <form class="add-recipe container section">
      <h6 >Nuevo platillo</h6>
      <div class="divider"></div>
      <div class="input-field">
        <input placeholder="ejemplo: Pizza" id="title" type="text" class="validate">
        <label for="title">Nombre</label>
      </div>
      <div class="input-field">
        <input placeholder="e.g. Tofu, mushroom, garlic" id="ingredientes" type="text" class="validate">
        <label for="ingredients">Ingredientes</label>
      </div>
      <div class="input-field">
        <input placeholder="ejemplo: 50.00" id="price" type="text" class="validate">
        <label for="price">Precio</label>
      </div>
      <input id="fotoFinal" type="hidden" name="fotoFinal" value="">
      <div class="input-field center">
        <button class="btn-small">Agregar</button>
      </div>
    </form>
    <div class="input-field center">
      <button id="btnFoto">Imagen</button>
      <button id="btnCapturar" type="button">Capturar</button>
    </div>
    <div id="camara">
            <video id="video">No hay video disponible</video>
      </div>
      <canvas id="canvas"></canvas>
      <div id="salida">
          <img id="foto" src="" alt="Foto del platillo">
        </div>

  </div>
