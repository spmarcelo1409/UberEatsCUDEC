<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
  <title>VentaPatito - Pedidos</title>

  <!-- materialize icons, css & js -->
  <link type="text/css" href="../css/materialize.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <link type="text/css" href="../css/styles.css" rel="stylesheet">
  <script type="text/javascript" src="../js/materialize.min.js"></script>

  <!-- Mapa (Leaflet) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""></script>
  <style>
    #mapa{ height: 220px; margin-top: 15px; }
    #qrcode{ margin-top: 10px; }
    #qrcode img, #qrcode canvas{ display: inline-block; }
  </style>

  <link rel="manifest" href="../manifest.json">
  <meta name="theme-color" content="#FF8816">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="application-name" content="VPTT">
  <meta name="apple-mobile-web-app-title" content="VPTT">

  <link rel="icon" type="image/png" sizes="32x32" href="../iconos/icon-32x32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../iconos/icon-192x192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../iconos/icon-180x180.png">
</head>
<body class="grey lighten-4">

  <!-- Menu superior -->
  <nav class="z-depth-0">
    <div class="nav-wrapper container">
      <a href="../index.html">Venta<span>Patito</span></a>
      <span class="right grey-text text-darken-1">
        <i class="material-icons sidenav-trigger" data-target="side-menu">menu</i>
      </span>
    </div>
  </nav>

  <!-- Menu lateral -->
  <ul id="side-menu" class="sidenav side-menu">
    <li><a class="subheader">VentaPatito</a></li>
    <li><a href="../index.html" class="waves-effect">Inicio</a></li>
    <li><a href="about.html" class="waves-effect">Acerca</a></li>
    <li><div class="divider"></div></li>
    <li><a href="contact.html" class="waves-effect">
      <i class="material-icons">mail_outline</i>Contacto</a>
    </li>
    <li><div class="divider"></div></li>
    <li><a href="pedidos.html" class="waves-effect">Pedidos</a></li>
  </ul>

  <!-- content -->
  <div class="container grey-text">
    <form class="add-recipe container section">
      <div class="input-field">
        <label for="listaPlatillos" class="active">Platillo</label>
        <select id="listaPlatillos" name="platillo" class="browser-default"
          style="margin-top: 15px; border: 1px solid #ccc; border-radius: 4px; padding: 5px;">
          <option value="" disabled selected>Seleccionar...</option>
        </select>
      </div>

      <div class="input-field">
        <input id="nombre" type="text" class="validate" name="nombre">
        <label for="nombre">Nombre</label>
      </div>

      <div class="input-field">
        <textarea id="direccion" class="materialize-textarea" name="direccion"></textarea>
        <label for="direccion">Direccion</label>
      </div>

      <div class="input-field center" style="margin-top: 40px;">
        <button id="btnCancelar" type="button" class="btn grey lighten-1 z-depth-0" style="margin-right: 10px;">Cancelar</button>
        <button id="btnGuardar" type="button" class="btn add-btn z-depth-0">Guardar</button>
      </div>
    </form>

    <!-- Codigo QR del pedido registrado -->
    <div class="input-field center">
      <h6>Codigo QR del pedido</h6>
      <div id="qrcode"></div>
    </div>

    <div class="input-field">
      <a class="waves-effect waves-light btn" id="btnUbicacion" style="background-color: var(--title);">
        <i class="material-icons left">my_location</i>Obtener Ubicacion
      </a>
    </div>

    <div id="mapa"></div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>

  <script src="../js/ui.js"></script>
  <script src="../js/firebase.js"></script>
  <script src="../js/qrcode.min.js"></script>
  <script src="../js/pedidos.js"></script>
</body>
</html>
